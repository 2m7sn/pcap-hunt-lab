name: tests
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: |
          python -m pcaphunt.cli generate pcaps
          python -m pcaphunt.cli eval pcaps
          python -m pcaphunt.cli generate pcaps-hard --hard
          python -m pcaphunt.cli eval pcaps-hard
